<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" />

  <!-- Inner Soft Border -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Smart Home House Contour -->
  <path d="M 32 14 L 16 27 L 20 27 L 20 48 C 20 49.1 20.9 50 22 50 L 42 50 C 43.1 50 44 49.1 44 48 L 44 27 L 48 27 Z" 
        fill="rgba(15, 23, 42, 0.75)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="1.5"
        stroke-linejoin="round" />

  <!-- Energy Lightning Bolt Accent -->
  <polygon points="34,22 25,36 31,36 29,46 41,32 34,32" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
