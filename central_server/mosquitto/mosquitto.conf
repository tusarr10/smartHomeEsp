# ==============================================================================
# Mosquitto MQTT Broker Configuration for SmartHome Central Platform
# ==============================================================================

listener 1883 0.0.0.0
allow_anonymous true

# Persistence
persistence true
persistence_location ./data/mosquitto/

# Logging
log_dest stdout
log_dest file ./data/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Connection limits
max_connections 500
max_queued_messages 1000
