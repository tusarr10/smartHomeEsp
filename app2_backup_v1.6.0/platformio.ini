[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
